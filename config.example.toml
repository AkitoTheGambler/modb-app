# Copy to config.toml and fill in the values. All directories must exist.

[modb.app]
downloadsDirectory = ""
outputDirectory = ""
downloadControlStateDirectory = ""
# Crawlers to skip.
disabledCrawlers = ["anidb.net"]

[modb.app.crawler]
# Dead entries requested again per run, highest IDs first (AniList, Kitsu, MAL, AniDB).
deadEntriesToRecheck = 0

[modb.core.httpclient]
# Retries after server errors, 429 and timeouts, for all sites.
maxRetries = 5

[modb.anidb]
# api | website
source = "api"
# Client registered for the AniDB HTTP API.
client = ""
clientver = ""
# Retries while AniDB answers "banned", before the AniDB crawler stops.
banRetries = 5
